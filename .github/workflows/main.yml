name: Build ARM64 Only

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build-arm64-v2:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.3.0
        with:
          xcode-version: latest-stable
      
      - name: Set variables
        run: |
          HASH=$(cat SNAPSHOT_HASH)
          echo "SNAPSHOT_HASH=$HASH" >> $GITHUB_ENV
      
      - name: Install tools
        run: |
          brew install ninja python@3.13
          python3 -m pip install wheel --break-system-packages
          python3 -m pip install . --break-system-packages
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git clone https://github.com/flutter/flutter.git engine
      
      - name: gclient sync
        run: |
          ROOT_DIR=`pwd`
          export PATH=$PATH:$ROOT_DIR/depot_tools
          cd engine
          git config --global user.email "reflutter@example.com" && git config --global user.name "reflutter"
          git fetch origin $(reflutter -b ${{env.SNAPSHOT_HASH}})
          git reset --hard FETCH_HEAD
          reflutter -b ${{env.SNAPSHOT_HASH}}
          echo 'reflutter' > REFLUTTER
          git add . && git commit -am "reflutter"
          cd $ROOT_DIR
          mkdir customEngine
          cd customEngine
          echo 'solutions = [{"managed": False,"name": ".","url": "'$ROOT_DIR/engine'","custom_deps": {},"deps_file": "DEPS","safesync_url": "",},]' > .gclient
          gclient sync
          reflutter -b ${{env.SNAPSHOT_HASH}}
      
      - name: ninja build libflutter_arm64
        run: |
          export PATH=$PATH:`pwd`/depot_tools
          customEngine/engine/src/flutter/tools/gn --no-goma --android --android-cpu=arm64 --runtime-mode=release
          ninja -C customEngine/engine/src/out/android_release_arm64
      
      - name: Move to release
        run: |
          cp customEngine/engine/src/out/android_release_arm64/lib.stripped/libflutter.so libflutter_arm64.so
          ls -lh libflutter_arm64.so
      
      - name: Android-ARM64-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-arm64-v2-${{env.SNAPSHOT_HASH}}
          files: |
            ./libflutter_arm64.so

  build-arm64-v3:
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v2
      
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.3.0
        with:
          xcode-version: latest-stable
      
      - name: Set variables
        run: |
          HASH=$(cat SNAPSHOT_HASH)
          echo "SNAPSHOT_HASH=$HASH" >> $GITHUB_ENV
      
      - name: Install tools
        run: |
          brew install ninja python@3.13
          python3 -m pip install wheel --break-system-packages
          python3 -m pip install . --break-system-packages
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git clone https://github.com/flutter/flutter.git engine
      
      - name: gclient sync
        run: |
          ROOT_DIR=`pwd`
          export PATH=$PATH:$ROOT_DIR/depot_tools
          cd engine
          git config --global user.email "reflutter@example.com" && git config --global user.name "reflutter"
          git fetch origin $(reflutter -b ${{env.SNAPSHOT_HASH}})
          git reset --hard FETCH_HEAD
          reflutter -b ${{env.SNAPSHOT_HASH}} -p
          echo 'reflutter' > REFLUTTER
          git add . && git commit -am "reflutter"
          cd $ROOT_DIR
          mkdir customEngine
          cd customEngine
          echo 'solutions = [{"managed": False,"name": ".","url": "'$ROOT_DIR/engine'","custom_deps": {},"deps_file": "DEPS","safesync_url": "",},]' > .gclient
          gclient sync
          reflutter -b ${{env.SNAPSHOT_HASH}} -p
      
      - name: ninja build libflutter_arm64
        run: |
          export PATH=$PATH:`pwd`/depot_tools
          customEngine/engine/src/flutter/tools/gn --no-goma --android --android-cpu=arm64 --runtime-mode=release
          ninja -C customEngine/engine/src/out/android_release_arm64
      
      - name: Move to release
        run: |
          cp customEngine/engine/src/out/android_release_arm64/lib.stripped/libflutter.so libflutter_arm64.so
          ls -lh libflutter_arm64.so
      
      - name: Android-ARM64-Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-arm64-v3-${{env.SNAPSHOT_HASH}}
          files: |
            ./libflutter_arm64.so
